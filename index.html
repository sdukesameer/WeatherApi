<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Skyline — a live weather dashboard with hourly forecasts, air quality and day/night tracking." />
  <title>Skyline — Weather Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- Animated sky backdrop: gradient + particles react to live weather -->
  <canvas id="sky-canvas"></canvas>

  <main class="app" id="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">Skyline</span>
      </div>

      <div class="search-wrap">
        <form class="search" id="search-form" role="search" autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
            <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search a city…"
            aria-label="Search a city"
            aria-expanded="false"
            aria-controls="suggestions"
            role="combobox"
          />
          <button type="button" id="locate-btn" class="icon-btn" title="Use my location" aria-label="Use my current location">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 2V5M12 19V22M2 12H5M19 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </form>
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>

      <button type="button" id="unit-toggle" class="unit-toggle" aria-label="Toggle temperature unit">
        <span class="unit-option active" data-unit="metric">°C</span>
        <span class="unit-option" data-unit="imperial">°F</span>
      </button>
    </header>

    <div id="recent-chips" class="recent-chips" aria-label="Recent searches"></div>

    <section id="status-banner" class="status-banner" hidden></section>

    <section class="dashboard" id="dashboard" aria-live="polite">

      <!-- Hero readout -->
      <div class="hero glass">
        <div class="hero-top">
          <div>
            <h1 class="city-name" id="city-name">—</h1>
            <p class="city-meta" id="city-meta">&nbsp;</p>
          </div>
          <div class="condition-icon" id="condition-icon" aria-hidden="true"></div>
        </div>

        <div class="hero-mid">
          <span class="temp" id="temp">--°</span>
          <div class="hero-mid-side">
            <span class="condition-label" id="condition-label">—</span>
            <span class="feels-like" id="feels-like">Feels like --°</span>
          </div>
        </div>

        <!-- Day/night arc: sunrise → now → sunset -->
        <div class="sun-arc-wrap">
          <svg class="sun-arc" viewBox="0 0 240 130" aria-hidden="true">
            <path d="M10 120 A110 110 0 0 1 230 120" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 6"/>
            <circle id="sun-dot" cx="10" cy="120" r="5" fill="currentColor"/>
          </svg>
          <div class="sun-arc-labels">
            <span id="sunrise-label">-- : --</span>
            <span id="sunset-label">-- : --</span>
          </div>
        </div>
      </div>

      <!-- Stat grid -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat glass">
          <span class="stat-label">Humidity</span>
          <span class="stat-value" id="stat-humidity">--%</span>
        </div>
        <div class="stat glass">
          <span class="stat-label">Wind</span>
          <span class="stat-value" id="stat-wind">-- km/h</span>
        </div>
        <div class="stat glass">
          <span class="stat-label">Pressure</span>
          <span class="stat-value" id="stat-pressure">-- hPa</span>
        </div>
        <div class="stat glass">
          <span class="stat-label">Visibility</span>
          <span class="stat-value" id="stat-visibility">-- km</span>
        </div>
        <div class="stat glass">
          <span class="stat-label">UV / AQI</span>
          <span class="stat-value" id="stat-aqi">--</span>
        </div>
        <div class="stat glass">
          <span class="stat-label">Cloud cover</span>
          <span class="stat-value" id="stat-clouds">--%</span>
        </div>
      </div>

      <!-- 5-day forecast -->
      <div class="forecast glass">
        <h2 class="forecast-title">5-day forecast</h2>
        <div class="forecast-strip" id="forecast-strip"></div>
      </div>

      <!-- Hourly forecast -->
      <div class="hourly glass">
        <h2 class="forecast-title">Next hours</h2>
        <div class="hourly-strip" id="hourly-strip"></div>
      </div>

    </section>

    <!-- Skeleton shown while loading -->
    <section class="skeleton" id="skeleton" aria-hidden="true">
      <div class="glass skeleton-hero shimmer"></div>
      <div class="skeleton-grid">
        <div class="glass shimmer"></div>
        <div class="glass shimmer"></div>
        <div class="glass shimmer"></div>
        <div class="glass shimmer"></div>
        <div class="glass shimmer"></div>
        <div class="glass shimmer"></div>
      </div>
    </section>

    <footer class="footer">
      <span>Built by Sameer Sk · 2026</span>
      <span class="footer-sep">·</span>
      <span>Data by OpenWeather</span>
    </footer>
  </main>

  <script src="./script.js" defer></script>
</body>
</html>
